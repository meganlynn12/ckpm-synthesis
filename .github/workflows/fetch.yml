name: Fetch & Summarize Content

on:
  schedule:
    # 7 AM MDT (UTC-6) = 13:00 UTC. In winter (MST, UTC-7) this becomes 6 AM MT —
    # add "0 14 * * *" as a second cron if you want to preserve 7 AM through DST.
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Job 1: OSINT — Substack & Open Web pipeline
  # ─────────────────────────────────────────────
  substack-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Run OSINT pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py

      - name: Commit OSINT output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/content.json output/archive.json output/20*.json || true
          git diff --staged --quiet || git commit -m "chore: OSINT briefing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  # ─────────────────────────────────────────────
  # Job 2: PROPINT — Premium Journalism pipeline
  # ─────────────────────────────────────────────
  premium-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: substack-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PROPINT pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_TOKEN_JSON_2: ${{ secrets.GMAIL_TOKEN_JSON_2 }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main_premium.py

      - name: Commit PROPINT output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/premium_content.json output/premium_archive.json output/premium_20*.json || true
          git diff --staged --quiet || git commit -m "chore: PROPINT briefing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push