name: Fetch & Summarize Content

on:
  schedule:
    - cron: "0 13 * * *"   # 9 AM EDT / 7 AM MDT
    # - cron: "0 14 * * *"   # 9 AM EST / 7 AM MST
    - cron: "0 1 * * *"    # 9 PM EDT / 7 PM MDT
    # - cron: "0 2 * * *"    # 9 PM EST / 7 PM MST
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Substack & Open Web pipeline
  # ─────────────────────────────────────────────
  substack-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Run Substack pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN }}
        run: python main.py

      - name: Commit Substack output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/content.json output/archive.json output/20*.json || true
          git diff --staged --quiet || git commit -m "chore: substack briefing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  # ─────────────────────────────────────────────
  # Job 2: Premium Journalism pipeline
  # ─────────────────────────────────────────────
  premium-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: substack-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Premium pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_TOKEN_JSON_2: ${{ secrets.GMAIL_TOKEN_JSON_2 }}
        run: python main_premium.py

      - name: Commit Premium output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/premium_content.json output/premium_archive.json output/premium_20*.json || true
          git diff --staged --quiet || git commit -m "chore: premium briefing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push