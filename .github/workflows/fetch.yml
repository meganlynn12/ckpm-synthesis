name: Fetch & Summarize Content

on:
  schedule:
    # 6 AM ET = 11:00 UTC (EST) / 10:00 UTC (EDT)
    # Running at both to handle DST transitions
    - cron: "0 11 * * *"      # 6 AM ET / 11:00 UTC
    # - cron: "0 17 * * *"      # 12 PM ET / 17:00 UTC
    - cron: "0 23 * * *"      # 6 PM ET / 23:00 UTC

  workflow_dispatch:  # allow manual trigger from Actions tab

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Substack & Open Web pipeline (existing)
  # ─────────────────────────────────────────────
  substack-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Substack pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python main.py

      - name: Commit Substack output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/content.json output/archive.json output/20*.json || true
          git diff --staged --quiet || git commit -m "chore: substack briefing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  # ─────────────────────────────────────────────
  # Job 2: Premium Journalism pipeline (new)
  # ─────────────────────────────────────────────
  premium-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run after substack job to avoid git push conflicts
    needs: substack-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pull fresh after substack job's commit
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Premium pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_TOKEN_JSON_2: ${{ secrets.GMAIL_TOKEN_JSON_2 }}

        run: python main_premium.py

      - name: Commit Premium output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/premium_content.json output/premium_archive.json output/premium_20*.json || true
          git diff --staged --quiet || git commit -m "chore: premium briefing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push